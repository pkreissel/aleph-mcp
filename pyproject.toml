[project]
name = "aleph-mcp"
version = "0.1.0"
description = "Read-only MCP server for any Aleph instance, built on the official alephclient library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "alephclient>=2.7.0",
    "anyio>=4.0",
]

[project.scripts]
aleph-mcp = "aleph_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aleph_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
